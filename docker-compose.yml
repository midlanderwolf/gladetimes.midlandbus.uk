x-app-environment: &app-environment
  - SECRET_KEY=${SECRET_KEY-}
  - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
  - REDIS_URL=${REDIS_URL-redis://redis:6379}
  - NTA_API_KEY
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - NEW_VEHICLE_WEBHOOK_URL
  - NEW_LICENSE_WEBHOOK_URL
  - PYTHONWARNINGS=all
  - FLICKR_API_KEY
  - FLICKR_API_SECRET
  - DEFAULT_FROM_EMAIL
  - EMAIL_HOST
  - EMAIL_HOST_USER
  - EMAIL_HOST_PASSWORD
  - EMAIL_PORT
  - EMAIL_USE_TLS
  - EMAIL_USE_SSL

x-app-volumes: &app-volumes
  - .:/app
  - venv:/app/.venv

services:

  web:
    build: .
    entrypoint: sh -c "DEBUG=1 exec ./manage.py runserver 0.0.0.0:8000"
    container_name: django_web
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - "8000:8000"
      - "35729:35729"
    restart: on-failure

  distribute_vehicle_locations:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py distribute_vehicle_locations
    restart: on-failure

  listen:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py listen
    restart: on-failure

  huey:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py run_huey
    restart: on-failure

  postgres:
    image: postgis/postgis
    tmpfs:
      - "/var/lib/postgresql/data/"
    # # sloppy non-durable settings, which allegedly make the tests run faster
    # # not to be used in production!
    # command: --autovacuum=off --fsync=off --synchronous_commit=off --full_page_writes=off --work_mem=12MB --max-connections=10 --max_wal_senders=0
    environment:
      - PGUSER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis

volumes:
  venv:
