x-app-environment: &app-environment
  - SECRET_KEY=${SECRET_KEY-}
  - DATABASE_URL=${DATABASE_URL-postgis://postgres:postgres@postgres/postgres}
  - REDIS_URL=${REDIS_URL-redis://redis:6379}
  - NTA_API_KEY
  - ALLOWED_HOSTS
  - CSRF_TRUSTED_ORIGINS
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - NEW_VEHICLE_WEBHOOK_URL
  - NEW_LICENSE_WEBHOOK_URL
  - PYTHONWARNINGS=all
  - FLICKR_API_KEY
  - FLICKR_API_SECRET
  - DEFAULT_FROM_EMAIL
  - EMAIL_HOST
  - EMAIL_HOST_USER
  - EMAIL_HOST_PASSWORD
  - EMAIL_PORT
  - EMAIL_USE_TLS
  - EMAIL_USE_SSL

x-app-volumes: &app-volumes
  - .:/app
  - venv:/app/.venv
  # the code is bind-mounted over the image, so STATIC_ROOT has to be writable
  # and outlive the container - otherwise the manifest is whatever was built
  # into the image and can go stale against the templates
  - staticfiles:/staticfiles

services:

  web:
    build: .
    # NOT runserver, and NOT DEBUG=1: with DEBUG on, CACHES["default"] is a
    # DummyCache, so vehicles.json re-fetches every Vehicle row from the
    # database on every request, and huey tasks run inline in the request.
    # asgi (not the Dockerfile's wsgi) because /firehose is a websocket.
    entrypoint:
      - granian
      - --host=0.0.0.0
      - --port=8000
      - --interface=asgi
      - --workers=4
      - --respawn-failed-workers
      - buses.asgi:application
    container_name: django_web
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - "8000:8000"
    restart: on-failure

  distribute_vehicle_locations:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py distribute_vehicle_locations
    restart: on-failure

  listen:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py listen
    restart: on-failure

  huey:
    image: bustimesorg-web
    depends_on:
      - web
    environment: *app-environment
    volumes: *app-volumes
    command: uv run manage.py run_huey
    restart: on-failure

  postgres:
    image: postgis/postgis
    # NB: no tmpfs on /var/lib/postgresql/data - that would put the whole
    # database in RAM and lose it on every recreate
    # # sloppy non-durable settings, which allegedly make the tests run faster
    # # not to be used in production!
    # command: --autovacuum=off --fsync=off --synchronous_commit=off --full_page_writes=off --work_mem=12MB --max-connections=10 --max_wal_senders=0
    environment:
      - PGUSER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    # a backstop so redis can never grow big enough to push the host into swap
    # again (a single-threaded redis that has to fault pages back in from disk
    # stalls every client at once). The real fix is the TTL on journey
    # polylines in distribute_vehicle_locations.
    command:
      - redis-server
      - --maxmemory=12gb
      - --maxmemory-policy=allkeys-lru

volumes:
  venv:
  staticfiles:
