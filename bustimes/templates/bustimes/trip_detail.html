{% extends 'map.html' %}

{% block title %}{{ object.route.line_name }} – {{ object.operator }} – gladetimes.com{% endblock %}

{% block canonical %}<meta name="robots" content="noindex,noarchive">{% endblock %}

{% load static %}

{% block head %}
    <link rel="stylesheet" media="print" href="/liveries.{{ liveries_css_version }}.css" onload="this.onload=null;this.removeAttribute('media')">
{% endblock head %}

{% block footer %}
    <script id="trip-data" type="application/json">{{ stops_json }}</script>
    <script src="{% static 'dist/js/app.js' %}"></script>
{% endblock footer %}
